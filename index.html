<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #05051a, #11114a, #020208);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      color: #7dd3fc;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    nav a:hover {
      color: #7dd3fc;
    }

    main {
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .hero {
      max-width: 700px;
    }

    .hero h2 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #06111f;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Website</h1>

    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Welcome 🚀</h2>
      <p>
        This is a simple HTML website. You can customize the
        colors, text, buttons, and layout however you like.
      </p>

      <button onclick="alert('Hello!')">
        Click Me
      </button>
    </section>
  </main>

  <footer>
    © 2026 My Website
  </footer>

</body>
</html>
